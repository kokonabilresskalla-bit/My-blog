name: Validate Physics Studio
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check platform.js
          node --check games.js
          node --check tests/validate.mjs
      - name: Validate app structure and calculations
        run: node tests/validate.mjs
          node tests/games-runtime.mjs
